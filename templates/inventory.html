<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProfitLens Inventory</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>My Inventory</h1>

<a href="{{ url_for('export') }}"
   class="export-button">
    Export to Excel
</a>

    <a href="/">Back to Calculator</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Total Cost</th>
            <th>Selling Price</th>
            <th>Profit</th>
            <th>Image</th>
        </tr>

        {% for product in products %}
        <tr>
            <td>{{ product[0] }}</td>

            <td>
                <a href="{{ product[1] }}" target="_blank" rel="noopener noreferrer">
                    View Product
                </a>
            </td>

            <td>৳{{ product[2] }}</td>
            <td>৳{{ product[3] }}</td>
            <td>৳{{ product[4] }}</td>
            <td>
                {% if product[5] %}
                <img src="{{ url_for('static',
                                    filename= 'uploads/' ~ product[5]) }}" alt="Product image" clas="product-image">
                {% else %}
                No image
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
</body>

</html>
